# These are the items all players start with when /startgame is executed
# To view all attributes: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/attribute/Attribute.html
# Attribute operations:
#   - ADD_NUMBER
#   - ADD_PERCENTAGE
#   - MULTIPLY_BASE
#   - MULTIPLY_TOTAL
# To view all flags: https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/inventory/ItemFlag.html
0:
  material: IRON_PICKAXE
  enchantments:
    EFFICIENCY: 3
  unbreakable: true
  flags:
    - HIDE_ENCHANTS
  amount: 1

1:
  material: SMOOTH_STONE
  amount: 16

